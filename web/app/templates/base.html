<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Tienda Virtual{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('main.index') }}">Mi Tienda Virtual</a></h1>
        <nav>
            <a href="{{ url_for('main.index') }}">Catálogo</a>
            <a href="{{ url_for('main.categorias') }}">Categorías</a>
        </nav>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
